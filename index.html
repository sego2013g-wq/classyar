  --accent:#10b981; --accent2:#34d399; --accent-soft:rgba(16,185,129,.13);
  --bg:#eefaf4; --bg2:#def3ea; --card:#ffffff; --card2:#f5fcf9;
  --text:#123327; --muted:#5d8a78; --border:#d8ede4;
}
/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Vazirmatn','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  background:var(--bg); color:var(--text);
  transition:background .3s,color .3s; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{font-weight:800}
button{font-family:inherit}
/* ============ LAYOUT ============ */
.app{min-height:100vh}
.sidebar{
  position:fixed;top:0;bottom:0;inset-inline-start:0;width:252px;
  background:var(--side-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-inline-end:1px solid var(--border);display:flex;flex-direction:column;z-index:60;
  transition:transform .28s ease;
}
html[dir=rtl] .sidebar{--hidex:110%}
html[dir=ltr] .sidebar{--hidex:-110%}
.sb-logo{display:flex;gap:11px;align-items:center;padding:18px 16px 12px}
.logo-badge{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px -8px var(--accent)}
.logo-badge svg{width:24px;height:24px}
.sb-logo b{font-size:1.05rem;display:block}
.sb-logo small{font-size:.68rem;color:var(--muted);display:block;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav-grp{font-size:.7rem;color:var(--muted);margin:16px 10px 6px;font-weight:800;letter-spacing:.03em}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;
  color:var(--muted);cursor:pointer;font-weight:700;font-size:.88rem;transition:.18s;
  border:1px solid transparent;background:none;text-align:start;
}
.nav-item svg{flex:none;opacity:.85}
.nav-item:hover{background:var(--accent-soft);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.nav-item.active svg{opacity:1}
.nv-badge{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:.66rem;font-weight:800;padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
.sb-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:.7rem;color:var(--muted);line-height:1.9}
.sb-overlay{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:55;display:none;backdrop-filter:blur(2px)}
.sb-overlay.show{display:block;animation:fadeIn .2s}
.main{margin-inline-start:252px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{
  display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.tb-title{min-width:0}
.tb-title h1{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.view{padding:22px;flex:1;animation:pageIn .32s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
@keyframes fadeIn{from{opacity:0}}
.foot{padding:16px 22px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.foot b{color:var(--text)}
/* ============ HERO / CARDS ============ */
.hero{
  background:linear-gradient(118deg,var(--accent),var(--accent2));
  border-radius:22px;color:#fff;padding:22px 24px;position:relative;overflow:hidden;
  box-shadow:0 16px 34px -14px var(--accent);margin-bottom:16px;
}
.hero .pats{position:absolute;inset:0;opacity:.16;pointer-events:none}
.hero .h-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.hero h2{font-size:clamp(1.1rem,2.6vw,1.5rem)}
.hero p{opacity:.92;font-size:.83rem;margin-top:5px}
.hero .h-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn-h{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;backdrop-filter:blur(4px)}
.btn-h:hover{background:rgba(255,255,255,.3);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);font-weight:800;font-size:.93rem;flex-wrap:wrap}
.card-h .ic{color:var(--accent);display:grid;place-items:center}
.card-h .side{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transition:.2s}
.stat:hover{transform:translateY(-2px)}
.stat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.stat b{font-size:1.3rem;display:block;line-height:1.2}
.stat span{font-size:.72rem;color:var(--muted);font-weight:600}
/* ============ BUTTONS / INPUTS ============ */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--card);color:var(--text);
  font-weight:700;font-size:.85rem;cursor:pointer;transition:.18s;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.danger{background:rgba(239,68,68,.12);color:var(--bad);border-color:transparent}
.btn.ok{background:rgba(16,185,129,.12);color:var(--ok);border-color:transparent}
.btn.sm{padding:6px 11px;font-size:.76rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;position:relative;transition:.18s;flex:none;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn .dot{position:absolute;top:5px;inset-inline-end:5px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.hamb{display:none}
.inp,.sel{
  width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);font:inherit;font-size:.9rem;transition:.15s;
}
.inp:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--muted);opacity:.7}
.sel{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(0% + 16px) calc(50% + 1px),calc(0% + 20px) calc(50% + 1px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
html[dir=rtl] .sel{background-position:calc(100% - 18px) calc(50% + 1px),calc(100% - 14px) calc(50% + 1px)}
.lbl{font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:6px;display:block}
.field{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.mt{margin-top:14px}.mb{margin-bottom:14px}
/* ============ CHIPS / SEG / PILLS ============ */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);
  cursor:pointer;font-size:.82rem;font-weight:700;color:var(--muted);
  display:inline-flex;gap:7px;align-items:center;transition:.15s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .av-mini{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.6rem;font-weight:800}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:9px;font-size:.8rem;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgba(10,20,60,.1)}
.pill{padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.pill.ok{background:rgba(16,185,129,.14);color:var(--ok)}
.pill.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.pill.bad{background:rgba(239,68,68,.14);color:var(--bad)}
.pill.info{background:rgba(14,165,233,.14);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.mut{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:.95rem}
.av-mini{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.68rem;flex:none}
.av0{background:linear-gradient(135deg,#6366f1,#a855f7)}
.av1{background:linear-gradient(135deg,#ec4899,#f97316)}
.av2{background:linear-gradient(135deg,#0ea5e9,#10b981)}
.av3{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.av4{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.av5{background:linear-gradient(135deg,#14b8a6,#0ea5e9)}
.av6{background:linear-gradient(135deg,#ef4444,#a855f7)}
.av7{background:linear-gradient(135deg,#22c55e,#84cc16)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;border:none;background:none;font-weight:800;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-color:var(--accent)}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;flex:1;min-width:60px;border:1px solid var(--border)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s ease}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .ic{width:66px;height:66px;margin:0 auto 14px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty b{color:var(--text);display:block;margin-bottom:5px}
.empty p{font-size:.83rem}
.kbd{background:var(--card2);border:1px solid var(--border);border-bottom-width:2.5px;border-radius:7px;padding:1px 7px;font-size:.72rem;font-weight:800;color:var(--muted)}
/* ============ TABLES ============ */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--rs);background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:760px}
.tbl th{
  position:sticky;top:0;background:var(--card2);z-index:3;font-weight:800;font-size:.74rem;
  color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:center;
}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--card2)}
.sticky-col{position:sticky;inset-inline-start:0;background:var(--card);z-index:2;font-weight:700;text-align:start;padding:6px 12px;white-space:nowrap}
th.sticky-col{z-index:4;background:var(--card2)}
.tbl tr:hover .sticky-col{background:var(--card2)}
.rowavg{font-weight:800;background:var(--card2)}
.colavg{font-weight:800;background:var(--card2);color:var(--accent)}
/* grade cells */
.gin{
  width:56px;padding:6px 4px;text-align:center;border:1.5px solid transparent;border-radius:9px;
  background:var(--card2);color:var(--text);font:inherit;font-weight:800;font-size:.84rem;transition:.15s;
}
.gin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card)}
.gin.invalid{border-color:var(--bad);background:rgba(239,68,68,.1)}
.gbad{background:var(--gbad);color:var(--gbad-t)}
.gwarn{background:var(--gwarn);color:var(--gwarn-t)}
.ggood{background:var(--ggood);color:var(--ggood-t)}
.gexc{background:var(--gexc);color:var(--gexc-t)}
td.gbad,td.gwarn,td.ggood,td.gexc{font-weight:800;border-radius:8px}
.gcell-ro{display:inline-block;min-width:46px;padding:5px 4px;border-radius:8px;font-weight:800;font-size:.82rem}
/* ============ MODAL / TOAST ============ */
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.55);backdrop-filter:blur(5px);z-index:100;display:grid;place-items:center;padding:16px;animation:fadeIn .2s;overflow-y:auto}
.modal{
  background:var(--card);border-radius:20px;max-width:580px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(5,10,30,.55);animation:pop .28s ease;margin:auto;
}
.modal.lg{max-width:920px}
.m-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border);flex:none}
.m-h h3{font-size:1rem;flex:1;min-width:0}
.m-b{padding:18px 20px;overflow:auto}
.m-f{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex:none}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(12px)}}
.toast-wrap{position:fixed;bottom:18px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none;padding:0 12px}
.toast{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 18px;
  box-shadow:0 16px 40px -12px rgba(5,10,30,.4);display:flex;gap:9px;align-items:center;
  font-weight:700;font-size:.85rem;animation:toastIn .3s ease;max-width:480px;
}
.toast.ok{border-inline-start:4px solid var(--ok)}
.toast.bad{border-inline-start:4px solid var(--bad)}
.toast.info{border-inline-start:4px solid var(--info)}
.toast.warn{border-inline-start:4px solid var(--warn)}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
/* ============ CHARTS ============ */
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{max-width:100%;height:auto;display:block}
.ln{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar-anim{animation:grow .8s cubic-bezier(.2,.8,.3,1) both}
@keyframes grow{from{width:0}}
.radar-poly{animation:radarIn .7s ease-out both;transform-origin:center;transform-box:fill-box}
@keyframes radarIn{from{opacity:0;transform:scale(.55)}}
.donut-ring{transition:stroke-dasharray 1s ease}
.fade-1{animation:fadeIn .3s .05s both}.fade-2{animation:fadeIn .3s .15s both}.fade-3{animation:fadeIn .3s .25s both}
.lb-row{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px dashed var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-row .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;flex:none;background:var(--card2)}
.lb-row .nm{font-weight:700;font-size:.85rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .nm small{display:block;color:var(--muted);font-weight:600;font-size:.68rem}
.ins{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card2);margin-bottom:8px;font-size:.83rem;line-height:1.7;align-items:flex-start}
.ins .ic{flex:none;margin-top:2px}
.ins.ok{background:rgba(16,185,129,.09)}
.ins.warn{background:rgba(245,158,11,.1)}
.ins.bad{background:rgba(239,68,68,.09)}
.ins.acc{background:var(--accent-soft)}
.att-seg{display:inline-flex;gap:4px}
.att-seg button{border:1.5px solid var(--border);background:var(--card);border-radius:9px;padding:5px 9px;font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s}
.att-seg button.on.a-p{background:rgba(16,185,129,.15);color:var(--ok);border-color:var(--ok)}
.att-seg button.on.a-a{background:rgba(239,68,68,.15);color:var(--bad);border-color:var(--bad)}
.att-seg button.on.a-l{background:rgba(245,158,11,.15);color:var(--warn);border-color:var(--warn)}
.att-seg button.on.a-e{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.stars{display:inline-flex;gap:2px;color:var(--warn)}
.op-card{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--card2)}
.op-card .who{font-weight:800;font-size:.83rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.op-card p{font-size:.82rem;color:var(--text);opacity:.9;margin-top:6px;line-height:1.8}
.op-card time{font-size:.68rem;color:var(--muted)}
.thm-card{border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;transition:.18s;text-align:center}
.thm-card:hover{transform:translateY(-2px)}
.thm-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.thm-sw{display:flex;gap:5px;justify-content:center;margin-bottom:8px}
.thm-sw i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.thm-card b{font-size:.8rem}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-row .info{flex:1;min-width:180px}
.set-row .info b{font-size:.88rem;display:block}
.set-row .info small{color:var(--muted);font-size:.74rem}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--border);border-radius:99px;cursor:pointer;transition:.25s}
.switch i::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;inset-inline-start:3px;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked+i{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.switch input:checked+i::before{transform:translateX(-20px)}
html[dir=ltr] .switch input:checked+i::before{transform:translateX(20px)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:400}
.confetti span{position:absolute;width:9px;height:9px;border-radius:2px;animation:cf 1.3s ease-in forwards}
@keyframes cf{to{transform:translateY(60vh) rotate(720deg);opacity:0}}
.notif-item{display:flex;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--border);margin-bottom:10px;background:var(--card);align-items:flex-start;transition:.15s}
.notif-item.unread{border-inline-start:4px solid var(--accent);background:var(--accent-soft)}
.notif-item .ic{flex:none;margin-top:2px}
.notif-item b{font-size:.86rem;display:block}
.notif-item p{font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.7}
.notif-item time{font-size:.68rem;color:var(--muted);display:block;margin-top:5px}
#confettiHost span{position:fixed}
/* ============ AUTH SCREEN ============ */
body.auth-mode #app{display:none}
.auth-wrap{
  min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--accent-soft) 100%);
}
.auth-orbs{position:absolute;inset:0;pointer-events:none}
.auth-orbs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;
  background:radial-gradient(circle at 30% 30%,var(--accent),var(--accent2))}
.auth-orbs i:nth-child(1){width:340px;height:340px;top:-110px;inset-inline-start:-90px;opacity:.28}
.auth-orbs i:nth-child(2){width:230px;height:230px;bottom:-70px;inset-inline-end:-60px;opacity:.3}
.auth-orbs i:nth-child(3){width:120px;height:120px;top:18%;inset-inline-end:14%;opacity:.14}
.auth-card{
  position:relative;z-index:1;width:100%;max-width:430px;background:var(--card);
  border:1px solid var(--border);border-radius:24px;box-shadow:0 26px 60px -20px rgba(10,18,50,.35);
  padding:26px 24px 20px;animation:pop .35s ease;
}
.auth-logo{display:flex;gap:13px;align-items:center;justify-content:center;margin-bottom:8px}
.auth-logo .logo-badge{width:56px;height:56px;border-radius:18px}
.auth-foot{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);text-align:center;font-size:.68rem;color:var(--muted);line-height:1.9}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-spin{animation:spin .9s linear infinite}
#offbar{
  position:fixed;bottom:0;inset-inline:0;z-index:250;background:var(--warn);color:#fff;
  padding:9px 16px;font-size:.78rem;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;
  box-shadow:0 -6px 20px -8px rgba(0,0,0,.4);animation:toastIn .3s ease;text-align:center;
}
@media(max-width:640px){
  .auth-card{padding:20px 16px 16px;border-radius:20px}
}
/* ============ PRINT ============ */
#printArea{display:none}
@media print{
  body{background:#fff}
  .sidebar,.topbar,.foot,.no-print,.toast-wrap,.overlay{display:none!important}
  .main{margin:0}
  .view{padding:0}
  #printArea{display:block;color:#111;font-size:12px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:5px 6px;text-align:center;font-size:11px}
  #printArea .pr-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:14px}
  #printArea h2{font-size:17px}
}
/* ============ RESPONSIVE ============ */
@media(max-width:1080px){
  .grid3{grid-template-columns:1fr 1fr}
}
@media(max-width:980px){
  .sidebar{transform:translateX(var(--hidex,110%));box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .sidebar.open{transform:none}
  .main{margin-inline-start:0}
  .hamb{display:grid}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .view{padding:14px}
  .topbar{padding:10px 14px}
  .grid3{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .hero{padding:18px}
  .card-b{padding:13px 14px}
  .gin{width:48px}
  .tb-title p{display:none}
  .foot{justify-content:center;text-align:center}
}
@media(max-width:400px){
  .stats{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

const GUEST_KEY='classyar_v1';

const CFG_KEY='classyar_supabase';
const SUPA_URL=''; // ← آدرس پروژه Supabase خود را اینجا بگذار، مثل https://xxxx.supabase.co

const DEF={students:[],teachers:[],grades:{},attendance:{},schedule:{},opinions:[],notifications:[],feedbacks:[],
  settings:{theme:'light',lang:'fa',font:1,school:'',myId:null,digits:true,fx:true,notifLow:true,notifAbs:true},
  welcomed:false,seeded:false,_sync:null};
let S=null;

const PREF_KEYS=['theme','lang','font','digits','fx'];
function loadPrefs(){try{return JSON.parse(localStorage.getItem(PREFS_KEY))||{}}catch(e){return{}}}
function savePrefs(){try{const p={};PREF_KEYS.forEach(k=>p[k]=S.settings[k]);localStorage.setItem(PREFS_KEY,JSON.stringify(p))}catch(e){}}
function applyPrefs(){const p=loadPrefs();PREF_KEYS.forEach(k=>{if(p[k]!=null)S.settings[k]=p[k]})}
function load(){try{const r=localStorage.getItem(DBK);if(r){const d=JSON.parse(r);S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);S.settings=Object.assign(JSON.parse(JSON.stringify(DEF.settings)),d.settings||{});applyPrefs();return}}catch(e){}S=JSON.parse(JSON.stringify(DEF));applyPrefs()}
let saveT=null;
function save(immediate){
  clearTimeout(saveT);

    try{localStorage.setItem(DBK,JSON.stringify(S))}catch(e){}

/* ================= AUTH / CLOUD SYNC (Supabase) ================= */
const AUTH={mode:'auth',uid:null,email:null,phone:null,sync:'idle',lastSync:null,offline:false,viewSignup:false,viewCfg:false};
const LOCAL_USERS_KEY='classyar_local_users_v1';
const LOCAL_SESSION_KEY='classyar_local_session_v1';
function localUsers(){try{return JSON.parse(localStorage.getItem(LOCAL_USERS_KEY))||{}}catch(e){return {}}}
async function passDigest(phone,pass){const bytes=new TextEncoder().encode(phone+'|classyar-local-v1|'+pass);if(!crypto.subtle)throw new Error('برای ساخت حساب، سایت را با مرورگر به‌روز و از طریق HTTPS باز کنید.');const hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function localUserKey(phone){return 'classyar_v1_local_'+phone}

function localProfile(phone){const u=localUsers()[phone]||{};return{name:u.name||'',handle:u.handle||'',avatar:u.avatar||''}}
function saveLocalProfile(phone,patch){const us=localUsers();if(!us[phone])return false;Object.assign(us[phone],patch);try{localStorage.setItem(LOCAL_USERS_KEY,JSON.stringify(us));return true}catch(e){return false}}
function normHandle(v){return String(v||'').trim().replace(/^@+/,'').toLowerCase()}
function handleOK(h){return /^[a-z0-9_]{3,20}$/.test(h)}
function handleTaken(h,exceptPhone){const us=localUsers();return Object.keys(us).some(p=>p!==exceptPhone&&(us[p].handle||'')===h)}
function accAvatar(phone,size){
  const pr=localProfile(phone),r=Math.round(size*.32);
  if(pr.avatar)return `<span class="avatar" style="width:${size}px;height:${size}px;border-radius:${r}px;overflow:hidden;background:var(--card2)"><img src="${pr.avatar}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></span>`;
  const nm=(pr.name||'').trim();
  if(!nm)return `<span class="avatar av0" style="width:${size}px;height:${size}px;border-radius:${r}px">${ic('user',Math.round(size*.5))}</span>`;
  const h=[...nm].reduce((a,c)=>a+c.codePointAt(0),0)%8;
  return `<span class="avatar av${h}" style="width:${size}px;height:${size}px;border-radius:${r}px;font-size:${Math.round(size*.42)}px">${esc(nm.charAt(0))}</span>`;
}
let SB=null,syncStamp=null,pullT=null,pushT=null,dirty=false,offlineShown=false;
function getCfg(){
  let c={};try{c=JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){}
  const url=(c.url||SUPA_URL||'').trim().replace(/\/+$/,'');
  const key=(c.key||SUPA_KEY||'').trim();
  return {url,key,ok:!!url&&!!key&&/^https?:\/\//.test(url)};
}
function sbGet(){
  if(SB)return SB;
  const cfg=getCfg();
  if(!cfg.ok||!window.supabase)return null;
  try{
    SB=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    return SB;
  }catch(e){return null}
}
function netErr(e){return !navigator.onLine||(e&&(e.name==='TypeError'||/fetch|network|Failed/i.test(e.message||'')))}
function authErr(e){
  const m=String((e&&(e.message||e.msg||e))||'');
  if(netErr(e))return {fa:'اتصال به سرور برقرار نشد؛ اینترنت را بررسی کنید (داده‌های محلی شما امن هستند).',en:'Could not reach the server. Check your internet connection (your local data is safe).'};
  const map=[
    [/invalid login credentials/i,{fa:'شماره تلفن یا رمز عبور اشتباه است.',en:'Wrong phone number or password.'}],
    [/email not confirmed|confirm/i,{fa:'این پروژه روی «تأیید ایمیل» تنظیم شده؛ در پنل Supabase بخش Authentication گزینه Confirm email را خاموش کنید (بخش راهنما).',en:'This project requires email confirmation; turn off "Confirm email" in Supabase Authentication settings (see the guide).'}],
    [/already registered|already been registered|user already|PHONE_ALREADY/i,{fa:'این شماره تلفن قبلاً ثبت‌نام کرده است؛ لطفاً وارد حساب خود شوید.',en:'This phone number is already registered; please sign in to your account.'}],
    [/rate limit|too many/i,{fa:'تلاش‌های زیاد؛ چند دقیقه بعد دوباره امتحان کنید.',en:'Too many attempts; please wait a few minutes and try again.'}],
    [/password.*at least|short/i,{fa:'رمز عبور حداقل ۶ کاراکتر باشد.',en:'Password must be at least 6 characters.'}],
    [/phone address|invalid.*phone|unable to validate/i,{fa:'شماره تلفن معتبر نیست.',en:'Invalid phone number.'}],
    [/different from the original|same password|session.*missing|no session/i,{fa:'نشست ورود منقضی شده؛ لطفاً دوباره وارد شوید.',en:'Your session has expired; please sign in again.'}],
    [/signup requires|captcha|not allowed/i,{fa:'ثبت‌نام در این پروژه فعال نیست؛ با مدیر پروژه تماس بگیرید.',en:'Sign-ups are not allowed for this project; contact the project owner.'}],
    [/row-level security|permission|policy/i,{fa:'دسترسی به پایگاه داده رد شد؛ سیاست‌های RLS را طبق راهنما بررسی کنید.',en:'Database access denied; check the RLS policies as described in the guide.'}],
    [/schema cache|relation|table|function/i,{fa:'جدول پایگاه داده پیدا نشد؛ SQL راهنما را در Supabase اجرا کنید.',en:'Database table not found; run the setup SQL from the guide.'}]
  ];
  for(const [re,txt] of map)if(re.test(m))return txt;
  return {fa:'خطایی رخ داد: '+m.slice(0,120),en:'An error occurred: '+m.slice(0,120)};
}
const ERR=(e)=>{const x=authErr(e);return L()==='fa'?x.fa:x.en};
function userKey(uid){return 'classyar_v1_u_'+uid}
function isOfflineErr(e){return netErr(e)}
function scheduleCloudPush(){
  if(AUTH.mode!=='cloud')return;
  dirty=true;setSync('pending');
  clearTimeout(pushT);
  pushT=setTimeout(cloudPush,1300);
}
function setSync(st,extra){
  AUTH.sync=st;if(extra)AUTH.lastSync=extra;
  document.querySelectorAll('[data-syncbadge]').forEach(el=>{
    el.innerHTML=syncBadgeIcon();
    el.title=syncTitle();
  });
  const c=document.getElementById('syncCardTxt');if(c)c.innerHTML=syncCardHTML();
  const ob=document.getElementById('offbar');
  if(AUTH.offline&&!ob){const d=document.createElement('div');d.id='offbar';d.innerHTML='<span>'+ic('alert',15)+'</span>'+(L()==='fa'?'اینترنت قطع است — تغییرات روی همین دستگاه ذخیره می‌شود و پس از اتصال همگام‌سازی می‌شود.':'You are offline — changes are stored on this device and will sync once you reconnect.');document.body.appendChild(d)}
  if(!AUTH.offline&&ob)ob.remove();
}
function syncBadgeIcon(){
  const s=AUTH.sync;
  if(AUTH.mode==='local'&&AUTH.phone)return accAvatar(AUTH.phone,30);
  if(AUTH.offline)return `<span style="color:var(--warn);display:grid;place-items:center">${ic('alert',18)}</span><span class="dot" style="background:var(--warn)"></span>`;
  if(s==='error')return `<span style="color:var(--bad)">${ic('globe',18)}</span><span class="dot"></span>`;
  if(s==='pending')return `<span style="color:var(--warn)">${ic('globe',18)}</span><i class="sync-spin" style="position:absolute;top:10px;inset-inline-end:10px;width:8px;height:8px;border:2px solid var(--warn);border-top-color:transparent;border-radius:50%"></i>`;
  if(s==='ok')return `<span style="color:var(--ok)">${ic('cloud',18)}</span>`;
  return `<span>${ic('user',18)}</span>`;
}
function syncTitle(){
  if(AUTH.mode!=='cloud'){const pr=AUTH.phone?localProfile(AUTH.phone):null;return (pr&&pr.name)?pr.name:(L()==='fa'?'حساب کاربری':'Account')}
  const m={fa:{ok:'همگام‌سازی‌شده با ابر',pending:'در انتظار همگام‌سازی...',error:'خطای همگام‌سازی',idle:'ورود کرده'}[AUTH.sync]||'',en:{ok:'Synced with cloud',pending:'Pending sync...',error:'Sync error',idle:'Signed in'}[AUTH.sync]||''};
  return (L()==='fa'?'وضعیت: ':'Status: ')+m+(AUTH.lastSync?' — '+timeAgo(AUTH.lastSync):'');
}
async function cloudPush(){
  if(AUTH.mode!=='cloud'||!sbGet())return;
  if(!navigator.onLine){AUTH.offline=true;setSync('pending');return}
  try{
    const payload=JSON.parse(JSON.stringify(S));
    const {data,error}=await SB.from('classyar_data').upsert({id:AUTH.uid,data:payload},{onConflict:'id'}).select('updated_at').single();
    if(error)throw error;
    syncStamp=data.updated_at;dirty=false;AUTH.offline=false;offlineShown=false;
    setSync('ok',Date.now());
  }catch(e){
    if(isOfflineErr(e)){AUTH.offline=true;if(!offlineShown){toast(ERR(e),'warn',3500);offlineShown=true}setSync('pending')}
    else{setSync('error');toast(ERR(e),'bad',3500)}
  }
}
async function cloudPull(initial){
  if(AUTH.mode!=='cloud'||!sbGet())return;
  if(!navigator.onLine){AUTH.offline=true;setSync(initial?'error':'pending');return}
  try{
    const {data,error}=await SB.from('classyar_data').select('data,updated_at').eq('id',AUTH.uid).maybeSingle();
    if(error)throw error;
    AUTH.offline=false;offlineShown=false;
    if(data&&data.data){
      if(syncStamp!==data.updated_at){
        S=Object.assign(JSON.parse(JSON.stringify(DEF)),data.data);
        S.settings=Object.assign(JSON.parse(JSON.stringify(DEF.settings)),(data.data.settings)||{});
        applyPrefs();
        syncStamp=data.updated_at;dirty=false;
        if(!initial)render();
      }
      setSync('ok',Date.now());
    }else{
      setSync('ok',Date.now());
      if(initial)offerMigration();
    }
  }catch(e){
    if(isOfflineErr(e)){AUTH.offline=true;setSync('error')}
    else setSync('error');
    if(initial&&!isOfflineErr(e))toast(ERR(e),'bad',3500);
  }
}
function subscribeRealtime(){
  if(AUTH.mode!=='cloud'||!sbGet())return;
  try{
    if(AUTH._ch)SB.removeChannel(AUTH._ch);
    AUTH._ch=SB.channel('cy_'+AUTH.uid.slice(0,8))
      .on('postgres_changes',{event:'*',schema:'public',table:'classyar_data',filter:'id=eq.'+AUTH.uid},()=>{
        clearTimeout(pullT);pullT=setTimeout(()=>cloudPull(false),700);
      }).subscribe();
  }catch(e){}
}
function offerMigration(){
  const hasLocal=(()=>{try{const r=localStorage.getItem(GUEST_KEY);if(!r)return false;const d=JSON.parse(r);return d&&Array.isArray(d.students)&&d.students.length>0}catch(e){return false}})();
  if(!hasLocal||S.welcomed===false&&S.students.length===0){if(!S.welcomed&&!S.seeded)welcomeModal();return}
  openModal(`
  ${mHead(L()==='fa'?'انتقال داده‌های محلی به حساب ابری':'Move local data to your cloud account','upload')}
  <div class="m-b"><p style="font-size:.88rem;line-height:2">${L()==='fa'?'روی این دستگاه داده‌های محلی پیدا شد ('+S.students.length+' دانش‌آموز). آیا می‌خواهی این داده‌ها به حساب ابری‌ات منتقل شوند؟ اگر نه، حساب با داده‌های خالی شروع می‌شود و داده‌های محلی می‌مانند.':'We found local data on this device ('+S.students.length+' students). Move it to your cloud account? If not, the account starts empty and local data stays untouched.'}</p></div>
  <div class="m-f">
    <button class="btn" data-act="migNo">${t('cancel')}</button>
    <button class="btn primary" data-act="migYes">${ic('upload',15)} ${L()==='fa'?'انتقال و همگام‌سازی':'Move & sync'}</button>
  </div>`);
}
function startSession(session,initial){
  AUTH.mode='cloud';
  document.body.classList.remove('auth-mode');
  AUTH.uid=session.user.id;AUTH.email=session.user.email;
  AUTH.phone=(session.user.email&&session.user.email.endsWith('@phone.classyar.app'))?session.user.email.split('@')[0]:null;
  DBK=userKey(AUTH.uid);
  load();
  render();
  setSync('idle');
  document.getElementById('authRoot').innerHTML='';
  cloudPull(true);
  subscribeRealtime();
  if(initial&&session.user.created_at&&Date.now()-new Date(session.user.created_at).getTime()<15000)toast(L()==='fa'?'حساب شما ساخته شد؛ خوش آمدی! 🎉':'Account created — welcome! 🎉','ok');
}
async function initAuth(){
  const prefs=loadPrefs();
  const seed=JSON.parse(JSON.stringify(DEF));seed.settings=Object.assign(seed.settings,prefs);

function svgLineChart(series,labels,w=580,h=230,opts={}){
  const padL=34,padR=14,padT=16,padB=30;
  const iw=w-padL-padR,ih=h-padT-padB;

  });
  let xl='';

    xl+=`<text x="${X(i)}" y="${h-8}" font-size="8.5" fill="var(--muted)" text-anchor="middle">${lb}</text>`;

    paths+=`<path class="ln" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:${idx*.15}s"/>`;
    if(pts.length===1)paths+=`<circle cx="${X(pts[0].i)}" cy="${Y(pts[0].v)}" r="3" fill="${s.color}"/>`;

function svgBarH(items,w=540,color){
  const rows=items.length;if(!rows)return '';

function svgRadar(labels,series,size=330){
  const cx=size/2,cy=size/2,Rr=size/2-42,n=labels.length;
  const ang=i=>-Math.PI/2+(2*Math.PI*i/n);
  const P=(i,f)=>`${(cx+Math.cos(ang(i))*Rr*f).toFixed(1)},${(cy+Math.sin(ang(i))*Rr*f).toFixed(1)}`;
  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{
    grid+=`<polygon points="${labels.map((_,i)=>P(i,f)).join(' ')}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  });
  labels.forEach((lb,i)=>{
    grid+=`<line x1="${cx}" y1="${cy}" x2="${P(i,1).split(',')[0]}" y2="${P(i,1).split(',')[1]}" stroke="var(--border)" stroke-width="1"/>`;
    const lx=cx+Math.cos(ang(i))*(Rr+16),ly=cy+Math.sin(ang(i))*(Rr+16);
    const anch=Math.abs(Math.cos(ang(i)))<.3?'middle':Math.cos(ang(i))>0?'start':'end';
    grid+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" font-size="8.5" fill="var(--muted)" text-anchor="${anch}" font-weight="700">${lb}</text>`;
  });
  let polys='';
  series.forEach((s,idx)=>{
    const pts=labels.map((_,i)=>P(i,Math.max(0.02,Math.min(1,(s.values[i]||0)/20)))).join(' ');
    polys+=`<polygon class="radar-poly" points="${pts}" fill="${s.color}" fill-opacity="0.14" stroke="${s.color}" stroke-width="2" style="animation-delay:${idx*.12}s"/>`;
  });

  return `<div class="chart-wrap" style="max-width:${size}px;margin:0 auto"><svg viewBox="0 0 ${size} ${size}">${grid}${polys}</svg>${leg}</div>`;
}
function svgDonut(v,size=132,label){
  const r=(size/2)-12,c=size/2,circ=2*Math.PI*r;
  const p=Math.max(0,Math.min(20,v))/20;
  const col=v==null?'var(--muted)':v<10?'var(--bad)':v<14?'var(--warn)':v<17?'var(--info)':'var(--ok)';
  return `<div style="display:inline-grid;place-items:center;position:relative;width:${size}px;height:${size}px">
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="11"/>
    <circle class="donut-ring" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${(circ*p).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>
  </svg>
  <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
    <div><b style="font-size:1.3rem;color:${col}">${fmt(v,1)}</b>${label?`<div style="font-size:.66rem;color:var(--muted);font-weight:700">${label}</div>`:''}</div>
  </div></div>`;
}
function svgStarBars(counts){ // counts = [c1..c5]

}

function insights(sid){
  const st=studentById(sid);if(!st)return[];
  const out=[];
  const oa=overallAvg(sid);
  const ca=classAvg(st.class);
  if(oa==null)return[{c:'',ic:'info',x:t('an.none')}];
  if(ca!=null){
    const d=oa-ca;
    if(d>=0.5)out.push({c:'ok',ic:'tup',x:t('an.vsAbove',{v:fmt(d,1)})+' ('+t('an.vsclass')+')'});
    else if(d<=-0.5)out.push({c:'bad',ic:'tdown',x:t('an.vsBelow',{v:fmt(Math.abs(d),1)})+' ('+t('an.vsclass')+')'});
    else out.push({c:'acc',ic:'target',x:t('an.vsclass')+': '+fmt(oa,2)});
  }
  const bs=bestSubject(sid),ws=worstSubject(sid);
  if(bs&&bs.v>=15)out.push({c:'ok',ic:'award',x:t('an.strongIn',{s:subName(bs.si),v:fmt(bs.v)})});
  if(ws&&ws.v<13)out.push({c:'warn',ic:'alert',x:t('an.weakIn',{s:subName(ws.si),v:fmt(ws.v)})});
  // consistency (stddev of all grades)
  const all=[];(S.grades[sid]||[]).forEach(r=>r&&r.forEach(v=>{if(v!=null)all.push(v)}));
  if(all.length>=6){
    const m=avgArr(all);
    const sd=Math.sqrt(avgArr(all.map(v=>(v-m)*(v-m))));
    if(sd<2)out.push({c:'ok',ic:'check',x:t('an.consistGood')});
    else if(sd>3.5)out.push({c:'warn',ic:'alert',x:t('an.consistBad')});
  }
  // trend + projection
  const tr=periodTrend(sid).filter(v=>v!=null);
  const dir=trendDir(sid);
  if(dir===1)out.push({c:'ok',ic:'tup',x:t('an.up')});
  if(dir===-1)out.push({c:'bad',ic:'tdown',x:t('an.down')});
  const proj=projectNext(sid);
  if(proj!=null&&tr.length>=3)out.push({c:'acc',ic:'zap',x:t('an.projNext',{v:fmt(proj,1)})});
  return out;
}
function projectNext(sid){
  const a=periodTrend(sid).map((v,i)=>({v,i})).filter(p=>p.v!=null);
  if(a.length<3)return null;
  const n=a.length,xs=a.map(p=>p.i),ys=a.map(p=>p.v);
  const mx=avgArr(xs),my=avgArr(ys);
  let num=0,den=0;
  xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)*(x-mx)});
  if(!den)return null;
  const slope=num/den;
  return Math.max(0,Math.min(20,my+slope*(a[a.length-1].i+1-mx)));
}
function atRiskStudents(){
  const out=[];
  S.students.forEach(st=>{
    const tr=periodTrend(st.id).filter(v=>v!=null);
    if(tr.length<2)return;
    const oa=overallAvg(st.id);
    let reason=null;
    const last=tr[tr.length-1],prev=tr[tr.length-2];
    if(last!=null&&last<10)reason=t('g.lowAlert',{n:st.name,sub:perName(PERIODS.length-1),v:fmt(last)}).replace(/ \(.*\)/,'')||'';
    if(prev!=null&&last!=null&&prev-last>=2)reason=t('g.dropAlert',{n:st.name,v1:fmt(prev),v2:fmt(last)});
    if(oa!=null&&oa<12&&!reason)reason=t('an.vsclass')+': '+fmt(oa,2);
    if(reason)out.push({st,reason});
  });
  return out;
}

  return `
  <div class="row mb" style="gap:10px">

    <button class="btn sm soft" data-act="exportCsv" data-id="${sid}">⬇ Excel (CSV)</button>`:''}

      <tbody>${rows}<tr><td class="sticky-col colavg">Ø ${t('col.avg')}</td>${colAvgs}<td class="colavg" data-oavg2>${oa!=null?fmt(oa):'·'}</td>${editable?'<td></td>':''}</tr></tbody>
    </table>
  </div>
  ${editable?`<p style="font-size:.72rem;color:var(--muted);margin-top:10px"><span class="kbd">Enter</span> · <span class="kbd">↑ ↓ → ←</span> ${t('g.hint')}</p>`:''}`;
}
function needText(sid){
  const T=S.targets&&S.targets[sid],fa=L()==='fa';
  if(T==null)return fa?'هدف معدل را وارد کن':'Enter a target average';
  let sum=0,fw=0,tw=0;
  for(let si=0;si<14;si++){const w=coefOf(si);for(let pi=0;pi<9;pi++){tw+=w;const v=g(sid,si,pi);if(v!=null){sum+=v*w;fw+=w}}}
  const rw=tw-fw;
  if(rw<=0)return (fa?'همه‌ی نمرات ثبت شده؛ معدل نهایی ':'All grades entered; final ')+fmt(overallAvg(sid));
  const need=rnd((T*tw-sum)/rw,2);
  if(need<=0)return fa?'هدف تأمین شده ✅':'Target already secured ✅';
  if(need>20)return fa?'رسیدن به این هدف دیگر ممکن نیست (بیش از ۲۰ لازم است)':'Target no longer reachable (needs more than 20)';
  return (fa?'در بقیه‌ی خانه‌ها میانگین ':'Average needed in the remaining cells: ')+fmt(need)+(fa?' لازم است':'');
}
function exportCsv(sid){
  const st=studentById(sid);if(!st)return;
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const rows=[[L()==='fa'?'درس':'Subject',L()==='fa'?'ضریب':'Weight',...PERIODS.map((_,i)=>perName(i)),L()==='fa'?'میانگین':'Average']];
  SUBJECTS.forEach((_,si)=>rows.push([subName(si),coefOf(si),...PERIODS.map((_,pi)=>g(sid,si,pi)),subAvg(sid,si)!=null?fmtN(subAvg(sid,si)):'']));
  rows.push([L()==='fa'?'میانگین ماه':'Month average','',...PERIODS.map((_,pi)=>perAvg(sid,pi)!=null?fmtN(perAvg(sid,pi)):''),overallAvg(sid)!=null?fmtN(overallAvg(sid)):'']);
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=st.name+'.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function updateMatrixStats(sid){
  document.querySelectorAll('[data-need]').forEach(el=>el.textContent=needText(sid));
  for(let si=0;si<14;si++){const el=document.querySelector(`[data-ravg="${si}"]`);if(el){const a=subAvg(sid,si);el.textContent=a!=null?fmt(a):'·'}}
  for(let pi=0;pi<9;pi++){const el=document.querySelector(`[data-cavg="${pi}"]`);if(el){const a=perAvg(sid,pi);el.textContent=a!=null?fmt(a):'·'}}
  const oa=overallAvg(sid);
  document.querySelectorAll('[data-oavg],[data-oavg2]').forEach(el=>el.textContent=oa!=null?fmt(oa):'·');
  let filled=0;(S.grades[sid]||[]).forEach(r=>r&&r.forEach(v=>{if(v!=null)filled++}));
  document.querySelectorAll('[data-filledcnt],[data-mfilled]').forEach(c=>c.textContent=fmt(filled,0));
  document.querySelectorAll('[data-filledprog],[data-mprog]').forEach(pr=>pr.style.width=(filled/126*100).toFixed(0)+'%');
}

function teacherRating(tid){
  const ops=S.opinions.filter(o=>o.teacherId===tid);
  const r=avgArr(ops.map(o=>o.rating));
  return {avg:r,count:ops.length};
}
function rateTeacher(sid,tid,n,text){ // one rating per student per teacher (updates if exists)
  const st=studentById(sid);if(!st)return;
  const o=S.opinions.find(x=>x.sid===sid&&x.teacherId===tid);
  if(o){o.rating=n;o.date=new Date().toISOString();o.by=st.name;if(text)o.text=text}
  else S.opinions.push({id:uid(),teacherId:tid,sid,by:st.name,rating:n,text:text||'',date:new Date().toISOString()});
}
function teacherRanking(){
  return S.teachers.map(th=>{const ops=S.opinions.filter(o=>o.teacherId===th.id);
    return {th,count:ops.length,stars:ops.reduce((a,o)=>a+o.rating,0),avg:ops.length?ops.reduce((a,o)=>a+o.rating,0)/ops.length:null}})
    .filter(x=>x.count>0).sort((a,b)=>b.avg-a.avg||b.count-a.count||a.th.name.localeCompare(b.th.name,'fa'));
}

PAGES.schedule=function(){
  const sch=S.schedule[U.schClass]||{};
  const head=PERIODS.slice(0,6).map((_,i)=>`<th>${t('p.'+(i+1))}</th>`).join('');
  const rows=[0,1,2,3,4,5].map(d=>{
    const cells=Array(6).fill(null).map((_,p)=>{
      const si=sch[d]?sch[d][p]:null;
      const th=si!=null?S.teachers.find(x=>x.subjects.includes(si)&&x.classes.includes(U.schClass)):null;
      return `<td>
        <select class="sel schSel" data-d="${d}" data-p="${p}" style="min-width:96px;padding:6px 30px 6px 8px;font-size:.76rem;border-radius:9px">
          <option value="">—</option>
          ${SUBJECTS.map((s,i)=>`<option value="${i}" ${si===i?'selected':''}>${subShort(i)}</option>`).join('')}
        </select>
        ${th?`<div style="font-size:.62rem;color:var(--muted);margin-top:3px">${esc(th.name)}</div>`:''}
      </td>`;
    }).join('');
    return `<tr><td class="sticky-col">${t('day.'+d)}</td>${cells}</tr>`;
  }).join('');
  // conflicts
  const conflicts=[];
  for(let d=0;d<6;d++)for(let p=0;p<6;p++){
    const map={};
    ['7','8','9'].forEach(ck=>{
      const si=S.schedule[ck]&&S.schedule[ck][d]?S.schedule[ck][d][p]:null;
      if(si==null)return;
      const th=S.teachers.find(x=>x.subjects.includes(si)&&x.classes.includes(ck));
      if(th){(map[th.id]=map[th.id]||[]).push(clsName(ck))}
    });
    for(const tid in map){
      if(map[tid].length>1)conflicts.push(`${teacherById(tid)?esc(teacherById(tid).name):''} — ${t('day.'+d)} / ${t('p.'+(p+1))}: ${map[tid].join(' + ')}`);
    }
  }
  return `
  <div class="row spread mb">
    <div class="seg">${CLASSES.map(c=>`<button class="${U.schClass===c.k?'on':''}" data-act="schCls" data-v="${c.k}">${clsName(c.k)}</button>`).join('')}</div>
    <span class="pill ${conflicts.length?'bad':'ok'}" style="font-size:.76rem">${conflicts.length?ic('alert',13)+' '+t('sch.conflict').split('!')[0]:ic('check',13)+' '+t('sch.noConf')}</span>
  </div>
  ${conflicts.length?`<div class="ins bad mb"><span class="ic">${ic('alert',16)}</span><span>${t('sch.conflict')}<br>${conflicts.map(c=>'• '+c).join('<br>')}</span></div>`:''}
  <div class="card"><div class="card-h">${ic('calendar',17)} ${t('nav.schedule')} — ${clsName(U.schClass)}<span class="side"><span style="font-size:.72rem;color:var(--muted)">${t('sch.hint')}</span></span></div>
  <div class="card-b" style="padding:0">
    <div class="tbl-wrap"><table class="tbl" style="min-width:760px">
      <thead><tr><th class="sticky-col">${t('sch.day')}</th>${head}</tr></thead>
      <tbody id="schRows">${rows}</tbody></table></div>
  </div></div>`;
};

function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function exportJSON(){downloadFile('classyar-backup-'+todayISO()+'.json',JSON.stringify(S,null,1),'application/json');toast(t('g.saved'))}
function exportCSV(){
  let head=[t('f.name'),t('f.class')];
  SUBJECTS.forEach(s=>PERIODS.forEach((p,pi)=>head.push(s.fa+' - '+p.fa)));
  const lines=[head.join(',')];
  S.students.forEach(st=>{
    const row=[st.name,st.class];
    SUBJECTS.forEach((_,si)=>PERIODS.forEach((_,pi)=>row.push(g(st.id,si,pi)!=null?fmtN(g(st.id,si,pi)):'')));
    lines.push(row.join(','));
  });
  downloadFile('classyar-grades-'+todayISO()+'.csv','\uFEFF'+lines.join('\n'),'text/csv;charset=utf-8');
  toast(t('g.saved'));
}

async function doLogin(){
  const d=normPhone(document.getElementById('auPhone').value),pass=document.getElementById('auPass').value;
  if(!phoneOK(d)){auMsg('err',t('au.validPhone'));return}if(pass.length<6){auMsg('err',t('au.shortPass'));return}
  const users=localUsers(),u=users[d];if(!u){auMsg('err',L()==='fa'?'برای این شماره حسابی پیدا نشد؛ ابتدا ثبت‌نام کنید.':'No account found. Please sign up first.');return}
  try{if(await passDigest(d,pass)!==u.password){auMsg('err',L()==='fa'?'شماره تلفن یا رمز عبور اشتباه است.':'Incorrect phone number or password.');return}startLocalAccount(d)}catch(e){auMsg('err',e.message)}
}
async function doSignup(){
  const phoneInput=document.getElementById('auPhone');
  const d=normPhone(phoneInput ? phoneInput.value : '');
  const passInput=document.getElementById('auPass');
  const pass=passInput ? passInput.value : '';
  const pass2=(document.getElementById('auPass2')||{}).value;
  const nm=((document.getElementById('auName')||{}).value||'').trim();
  const hd=normHandle((document.getElementById('auHandle')||{}).value);
  if(nm.length<2){auMsg('err',t('au.validName'));return}
  if(!handleOK(hd)){auMsg('err',t('au.validHandle'));return}
  if(handleTaken(hd,null)){auMsg('err',t('au.handleTaken'));return}
  if(!phoneOK(d)){auMsg('err',t('au.validPhone'));return}
  if(pass.length<6){auMsg('err',t('au.shortPass'));return}
  if(pass!==pass2){auMsg('err',t('au.passMismatch'));return}
  const users=localUsers();
  if(users[d]){auMsg('err',L()==='fa'?'این شماره تلفن قبلاً ثبت‌نام کرده است؛ لطفاً وارد حساب خود شوید.':'This phone number is already registered. Please sign in.');return}
  try{
    users[d]={password:await passDigest(d,pass),createdAt:Date.now(),name:nm,handle:hd,avatar:''};
    localStorage.setItem(LOCAL_USERS_KEY,JSON.stringify(users));
    const old=localStorage.getItem(GUEST_KEY);
    const key=localUserKey(d);
    if(old&&!localStorage.getItem(key))localStorage.setItem(key,old);
    /* Registration creates the account only. The user signs in separately. */
    setAuTab('login');
    const phoneBox=document.getElementById('auPhone');
    if(phoneBox)phoneBox.value=d;
    auMsg('ok',L()==='fa'?'ثبت‌نام با موفقیت انجام شد. حالا شماره و رمز عبورت را در بخش ورود وارد کن.':'Registration successful. Now enter your phone and password in the sign-in tab.');
  }catch(e){auMsg('err',e.message||'ذخیره حساب امکان‌پذیر نیست.')}
}

document.addEventListener('change',e=>{
  const f=e.target;if(!f||f.id!=='accFile'||!f.files||!f.files[0])return;
  const file=f.files[0],keep=accDraft();
  if(!/^image\//.test(file.type)){toast(t('acc.notImg'),'bad');f.value='';return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const sz=256,c=document.createElement('canvas');c.width=c.height=sz;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz);
    URL.revokeObjectURL(url);
    if(saveLocalProfile(AUTH.phone,{avatar:c.toDataURL('image/jpeg',.85)})){render();accountModal(keep)}
    else toast(t('acc.imgFail'),'bad');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast(t('acc.imgFail'),'bad')};
  img.src=url;f.value='';
});

        if(typeof toast==='function')toast(L()==='fa'?'عملیات انجام نشد؛ دوباره تلاش کنید.':'Action failed. Please try again.','bad');
      });
    }catch(err){
      console.error('Classyar action error:',act,err);
      if(typeof toast==='function')toast(L()==='fa'?'عملیات انجام نشد؛ دوباره تلاش کنید.':'Action failed. Please try again.','bad');
    }
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('cin')){
    const v=parseFloat(normNum(el.value)),sid=(document.querySelector('.gin')||{dataset:{}}).dataset.sid;
    if(!(v>0&&v<=10)){el.classList.add('invalid');return}
    el.classList.remove('invalid');
    S.settings.coef=Array.isArray(S.settings.coef)?S.settings.coef:Array(14).fill(1);
    S.settings.coef[+el.dataset.coef]=v;save();if(sid)updateMatrixStats(sid);return;
  }
  if(el.hasAttribute&&el.hasAttribute('data-target')){
    const sid=(document.querySelector('.gin')||{dataset:{}}).dataset.sid,raw=normNum(el.value),v=parseFloat(raw);
    S.targets=S.targets||{};
    if(raw===''){delete S.targets[sid]}
    else if(!(v>0&&v<=20)){el.classList.add('invalid');return}
    else S.targets[sid]=Math.round(v*100)/100;
    el.classList.remove('invalid');save();if(sid)updateMatrixStats(sid);return;
  }
  if(el.classList&&el.classList.contains('gin')){
    const {sid,si,pi}=el.dataset;
    let raw=el.value.trim()
      .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/[٫،,\/]/g,'.').replace(/\s+/g,'');
    let v=null;
    if(raw!==''){
      if(!/^\d{1,2}(\.\d{0,2})?$/.test(raw)){el.classList.add('invalid');return}
      v=Math.round(parseFloat(raw)*100)/100;
      if(isNaN(v)||v<0||v>20){el.classList.add('invalid');return}
    }
    el.classList.remove('invalid');
    const row=ensureSub(sid,+si);
    const had=row[+pi];
    row[+pi]=v;
    el.classList.remove('gbad','gwarn','ggood','gexc');
    if(v!=null)el.classList.add(gcls(v));
    save();updateMatrixStats(sid);
    if(had==null&&v!=null)checkLowGrade(sid,+si,+pi,v);
    if(v>=20)confetti();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('gin')){
    const v=g(el.dataset.sid,+el.dataset.si,+el.dataset.pi);
    el.classList.remove('invalid');el.value=v!=null?fmtN(v):'';return;
  }
  if(el.classList&&el.classList.contains('rateStu')){U.rateSid=el.value||null;render();return}
  if(el.classList&&el.classList.contains('ratTxt')){
    const o=S.opinions.find(x=>x.sid===U.rateSid&&x.teacherId===el.dataset.id);
    if(!o){toast(L()==='fa'?'اول ستاره بده':'Pick stars first','warn');return}
    o.text=el.value.trim();save(true);toast(t('op.saved'));return;
  }
  if(el.classList&&el.classList.contains('cmpPer')){
    const i=+el.dataset.i;if(U.cmpSel[i]){U.cmpSel[i].pi=+el.value;render()}return;
  }
  if(el.id==='attDate'){U.attDate=el.value||todayISO();render();return}
  if(el.classList&&el.classList.contains('schSel')){
    const d=+el.dataset.d,p=+el.dataset.p;
    S.schedule[U.schClass]=S.schedule[U.schClass]||{};
    S.schedule[U.schClass][d]=S.schedule[U.schClass][d]||Array(6).fill(null);
    S.schedule[U.schClass][d][p]=el.value===''?null:+el.value;
    save(true);render();toast(t('sch.saved'));return;
  }
  if(el.dataset&&el.dataset.sw){
    const k=el.dataset.sw;S.settings[k]=el.checked;savePrefs();save(true);
    if(k==='digits')render();return;
  }
});
document.addEventListener('keydown',e=>{
  if(!e.target.classList||!e.target.classList.contains('gin'))return;
  const {sid,si,pi}=e.target.dataset;
  const s=+si,p=+pi,rtl=document.documentElement.dir==='rtl';
  let ns=null,np=null;
  if(e.key==='Enter'){ns=s+1;if(ns>13)ns=null;np=p}
  else if(e.key==='ArrowDown'){ns=s+1<14?s+1:null;np=p}
  else if(e.key==='ArrowUp'){ns=s-1>=0?s-1:null;np=p}
  else if(e.key==='ArrowLeft'){np=rtl?p+1:p-1;ns=s}
  else if(e.key==='ArrowRight'){np=rtl?p-1:p+1;ns=s}
  else return;
  if(e.key.startsWith('Arrow')||e.key==='Enter')e.preventDefault();
  if(np==null&&ns==null)return;
  if(np!=null&&(np<0||np>8))return;
  const next=document.querySelector(`.gin[data-sid="${sid}"][data-si="${ns==null?s:ns}"][data-pi="${np==null?p:np}"]`);
  if(next){next.focus();if(next.select)next.select()}
});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.students))throw 0;
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);
      S.settings=Object.assign(JSON.parse(JSON.stringify(DEF.settings)),d.settings||{});
      S.welcomed=true;save(true);go('dash');toast(t('set.impDone'));
    }catch(err){toast(t('set.impBad'),'bad')}
  };
  r.readAsText(f);
  e.target.value='';
});

initAuth();
